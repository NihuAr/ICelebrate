[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/api/*"
to = "https://icelebrate-api.herokuapp.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/media/*"
to = "https://icelebrate-api.herokuapp.com/media/:splat"
status = 200
force = true

# SPA fallback — все неизвестные маршруты идут на index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
